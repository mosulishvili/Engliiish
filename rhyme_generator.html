<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>სიტყვების რითმების გენერატორი</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f0f2f5; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .container { max-width: 100%; width: 100%; background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: flex; flex-direction: column; min-height: 95vh; }
        h1 { text-align: center; color: #333; margin: 0 0 15px 0; font-size: 1.5em; }
        .search-box { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 15px; flex-shrink: 0; }
        .font-control-group { display: flex; align-items: center; gap: 10px; background: #f8f9fa; padding: 10px 20px; border-radius: 8px; border: 2px solid #007bff; }
        .font-control-group label { font-size: 14px; color: #495057; font-weight: bold; }
        .font-btn { padding: 8px 15px; font-size: 18px; background: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; width: auto; min-width: 40px; font-weight: bold; }
        .font-btn:hover { background: #0056b3; }
        .font-size-display { font-size: 16px; color: #dc3545; font-weight: bold; min-width: 50px; text-align: center; background: white; padding: 5px 10px; border-radius: 4px; border: 1px solid #dee2e6; }
        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        button { padding: 15px 40px; font-size: 18px; background-color: #28a745; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: background 0.3s; width: 200px; }
        button:hover { background-color: #218838; }
        .speak-all-btn { background-color: #6f42c1; }
        .speak-all-btn:hover { background-color: #5a32a3; }
        .speak-all-btn:disabled { background-color: #a0a0a0; cursor: not-allowed; }
        .ios-fix-btn { background: #fd7e14; }
        .ios-fix-btn:hover { background: #e56b0a; }
        input { padding: 12px 15px; font-size: 16px; border: 2px solid #ddd; border-radius: 6px; outline: none; transition: border-color 0.3s; width: 300px; text-align: center; }
        input:focus { border-color: #007bff; }
        .results { display: flex; flex-direction: column; gap: 10px; flex: 1; }
        .variant-section { background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; }
        .variant-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; background: #e9ecef; cursor: pointer; transition: background 0.3s; user-select: none; flex-shrink: 0; }
        .variant-header:hover { background: #dee2e6; }
        .variant-header.active { background: #007bff; color: white; }
        .variant-header.active h3 { color: white; }
        .variant-header h3 { margin: 0; color: #495057; font-size: 1.1em; }
        .toggle-icon { font-size: 18px; transition: transform 0.3s; }
        .toggle-icon.collapsed { transform: rotate(-90deg); }
        .variant-content { max-height: 2000px; overflow-y: auto; transition: max-height 0.5s ease-out, padding 0.3s ease; padding: 10px 15px; }
        .variant-content.collapsed { max-height: 0; padding: 0 15px; overflow: hidden; }
        ol { padding-left: 25px; margin: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 5px 20px; }
        @media (max-width: 600px) { ol { grid-template-columns: 1fr; } input { width: 200px; } button { width: 180px; } }
        li { margin-bottom: 6px; color: #333; font-size: 1.1em; line-height: 1.4; cursor: pointer; padding: 4px 8px; border-radius: 4px; transition: background 0.2s; user-select: none; -webkit-tap-highlight-color: rgba(0,123,255,0.2); }
        li:hover { background: #e7f3ff; }
        li:active { background: #cce5ff; }
        li.speaking { background: #fff3cd !important; animation: pulse 0.5s ease-in-out infinite alternate; }
        @keyframes pulse { from { background: #fff3cd; } to { background: #ffeaa7; } }
        .georgian-phonetic { font-size: 0.9em; color: #6c757d; margin-left: 8px; }
        .georgian-phonetic::before { content: '('; }
        .georgian-phonetic::after { content: ')'; }
        .ending-info { text-align: center; color: #007bff; font-weight: bold; padding: 10px; background: #e7f3ff; border-radius: 6px; margin-bottom: 10px; }
        .speaker-icon { font-size: 0.8em; margin-right: 6px; opacity: 0.5; }
        li:hover .speaker-icon { opacity: 1; }
        .audio-hint { text-align: center; color: #6c757d; font-size: 13px; margin-top: 5px; }
    </style>
</head>
<body>
<div class="container">
    <h1>სიტყვების რითმების გენერატორი</h1>
    <div class="search-box">
        <div class="font-control-group">
            <label>ასოების ზომა:</label>
            <button class="font-btn" onclick="changeFontSize(-0.2)">−</button>
            <span class="font-size-display" id="font-size-display">1.1</span>
            <button class="font-btn" onclick="changeFontSize(0.2)">+</button>
        </div>
        <div class="btn-group">
            <button onclick="generateWords()">გენერირება</button>
            <button class="speak-all-btn" id="speak-all-btn" onclick="speakAllWords()" disabled>🔊 ყველას მოსმენა</button>
            <button class="ios-fix-btn" id="ios-fix-btn" onclick="initAudio()">🔊 ხმის ჩართვა</button>
        </div>
        <input type="text" id="wordInput" placeholder="ჩაწერე სიტყვა (მაგ: mountain, hello, world)..." onkeypress="if(event.key === 'Enter') generateWords()">
        <div class="audio-hint" id="audio-hint">💡 სიტყვაზე დაჭერით მოისმენთ ინგლისურ წარმოთქმას</div>
    </div>
    <div class="results">
        <div id="ending-info" class="ending-info" style="display:none;"></div>
        <div class="variant-section" id="variant1-section">
            <div class="variant-header active" onclick="toggleVariant('variant1')">
                <h3>ვარიანტი 1: ინგლისური + ქართული ფონეტიკური</h3>
                <span class="toggle-icon" id="variant1-icon">▼</span>
            </div>
            <div class="variant-content" id="variant1-content">
                <ol id="variant1"></ol>
            </div>
        </div>
        <div class="variant-section" id="variant2-section">
            <div class="variant-header" onclick="toggleVariant('variant2')">
                <h3>ვარიანტი 2: მხოლოდ ინგლისური</h3>
                <span class="toggle-icon collapsed" id="variant2-icon">▶</span>
            </div>
            <div class="variant-content collapsed" id="variant2-content">
                <ol id="variant2"></ol>
            </div>
        </div>
    </div>
</div>

let variantStates = { variant1: true, variant2: false };
let fontSize = 1.1;
let currentWords = [];
let isSpeakingAll = false;
let audioInitialized = false;

function initAudio() {
    if (!window.speechSynthesis) {
        alert('თქვენს მოწყობილობას არ აქვს ხმის მხარდაჭერა!');
        return;
    }
    const dummy = new SpeechSynthesisUtterance('hello');
    dummy.volume = 0.1;
    window.speechSynthesis.speak(dummy);
    audioInitialized = true;
    var btn = document.getElementById('ios-fix-btn');
    if (btn) btn.style.display = 'none';
    var hint = document.getElementById('audio-hint');
    if (hint) {
        hint.textContent = '✅ ხმა ჩართულია! სიტყვაზე დაჭერით მოისმენთ';
        hint.style.color = '#28a745';
    }
}

function speakWord(word, liElement) {
    if (!window.speechSynthesis) {
        alert('თქვენს ბრაუზერს არ აქვს ხმის მხარდაჭერა!');
        return;
    }
    if (!audioInitialized) {
        try {
            var dummy = new SpeechSynthesisUtterance('');
            dummy.volume = 0;
            window.speechSynthesis.speak(dummy);
            window.speechSynthesis.cancel();
            audioInitialized = true;
        } catch(e) {}
    }
    window.speechSynthesis.cancel();
    var utterance = new SpeechSynthesisUtterance(word);
    utterance.lang = 'en-US';
    utterance.rate = 1;
    utterance.pitch = 1;
    utterance.volume = 1;
    if (liElement) {
        document.querySelectorAll('li.speaking').forEach(function(li) { li.classList.remove('speaking'); });
        liElement.classList.add('speaking');
        utterance.onend = function() { liElement.classList.remove('speaking'); };
        utterance.onerror = function() { liElement.classList.remove('speaking'); };
    }
    window.speechSynthesis.speak(utterance);
}

function speakAllWords() {
    if (!window.speechSynthesis) return;
    if (isSpeakingAll) {
        window.speechSynthesis.cancel();
        isSpeakingAll = false;
        document.getElementById('speak-all-btn').textContent = '🔊 ყველას მოსმენა';
        document.querySelectorAll('li.speaking').forEach(function(li) { li.classList.remove('speaking'); });
        return;
    }
    if (currentWords.length === 0) return;
    isSpeakingAll = true;
    document.getElementById('speak-all-btn').textContent = '⏹ გაჩერება';
    var v1Items = document.getElementById('variant1').getElementsByTagName('li');
    var i = 0;
    function speakNext() {
        if (!isSpeakingAll || i >= currentWords.length) {
            isSpeakingAll = false;
            document.getElementById('speak-all-btn').textContent = '🔊 ყველას მოსმენა';
            return;
        }
        var word = currentWords[i];
        var li = v1Items[i];
        document.querySelectorAll('li.speaking').forEach(function(l) { l.classList.remove('speaking'); });
        li.classList.add('speaking');
        li.scrollIntoView({ behavior: 'smooth', block: 'center' });
        var utterance = new SpeechSynthesisUtterance(word);
        utterance.lang = 'en-US';
        utterance.rate = 1;
        utterance.pitch = 1;
        utterance.volume = 1;
        utterance.onend = function() {
            li.classList.remove('speaking');
            i++;
            if (isSpeakingAll && i < currentWords.length) {
                setTimeout(speakNext, 300);
            } else {
                isSpeakingAll = false;
                document.getElementById('speak-all-btn').textContent = '🔊 ყველას მოსმენა';
            }
        };
        utterance.onerror = function() {
            li.classList.remove('speaking');
            i++;
            if (isSpeakingAll && i < currentWords.length) {
                setTimeout(speakNext, 300);
            } else {
                isSpeakingAll = false;
                document.getElementById('speak-all-btn').textContent = '🔊 ყველას მოსმენა';
            }
        };
        window.speechSynthesis.speak(utterance);
    }
    speakNext();
}

        if (word.length > 2) rhymes.push(word);
    }
    var verbPrefixes = ["Re","Be","De","Pre","Over","Under","Out","Up","Down","Mis","Dis","Un","In","En","Em","Sub","Super","Inter","Trans","Counter","Anti","Pro","Auto","Co","Ex","Extra","Hyper","Macro","Mega","Micro","Mini","Mono","Multi","Neo","Non","Omni","Para","Poly","Pseudo","Retro","Semi","Socio","Tele","Ultra","Uni","Bio","Geo","Photo","Radio","Video","Audio","Cyber","Eco","Euro","Giga","Nano","Tera"];
    for (var i = 0; i < verbPrefixes.length; i++) {
        var word = verbPrefixes[i] + ending;
        if (word.length > 3) rhymes.push(word);
    }
    return rhymes;
}

function findRhymeKey(input) {
    var lowerInput = input.toLowerCase().trim();
    if (rhymeDB[lowerInput]) return { key: lowerInput, auto: false };
    for (var len = 5; len >= 1; len--) {
        if (lowerInput.length >= len) {
            var ending = lowerInput.slice(-len);
            if (rhymeDB[ending]) return { key: ending, auto: false };
        }
    }
    var autoEnding = lowerInput.length >= 3 ? lowerInput.slice(-3) : lowerInput.slice(-1);
    return { key: autoEnding, auto: true };
}

function changeFontSize(delta) {
    fontSize += delta;
    if (fontSize < 0.5) fontSize = 0.5;
    if (fontSize > 3.0) fontSize = 3.0;
    document.getElementById('font-size-display').textContent = fontSize.toFixed(1);
    updateFontSize('variant1');
    updateFontSize('variant2');
}

function updateFontSize(variantId) {
    var list = document.getElementById(variantId);
    if (!list) return;
    var items = list.getElementsByTagName('li');
    for (var i = 0; i < items.length; i++) {
        items[i].style.fontSize = fontSize + 'em';
        if (variantId === 'variant1') {
            var phoneticWords = items[i].getElementsByClassName('georgian-phonetic');
            for (var j = 0; j < phoneticWords.length; j++) {
                phoneticWords[j].style.fontSize = (fontSize * 0.8) + 'em';
            }
        }
    }
}

function toggleVariant(variantId) {
    variantStates[variantId] = !variantStates[variantId];
    var header = document.querySelector('#' + variantId + '-section .variant-header');
    var content = document.getElementById(variantId + '-content');
    var icon = document.getElementById(variantId + '-icon');
    if (variantStates[variantId]) {
        header.classList.add('active');
        content.classList.remove('collapsed');
        icon.classList.remove('collapsed');
        icon.textContent = '▼';
    } else {
        header.classList.remove('active');
        content.classList.add('collapsed');
        icon.classList.add('collapsed');
        icon.textContent = '▶';
    }
}

function generateWords() {
    var input = document.getElementById('wordInput').value.trim();
    var v1List = document.getElementById('variant1');
    var v2List = document.getElementById('variant2');
    var endingInfo = document.getElementById('ending-info');
    var speakAllBtn = document.getElementById('speak-all-btn');

    v1List.innerHTML = '';
    v2List.innerHTML = '';
    currentWords = [];
    isSpeakingAll = false;
    speakAllBtn.textContent = '🔊 ყველას მოსმენა';
    speakAllBtn.disabled = true;

    if(!input) {
        alert('გთხოვთ ჩაწეროთ სიტყვა!');
        return;
    }

    var result = findRhymeKey(input);
    var words = [];

    if (result.auto) {
        words = generateAutoRhymes(result.key);
        endingInfo.style.display = 'block';
        endingInfo.textContent = 'ავტომატური რითმები დაბოლოებით: -' + result.key;
    } else {
        words = rhymeDB[result.key].split(',');
        endingInfo.style.display = 'block';
        endingInfo.textContent = 'რითმები დაბოლოებით: -' + result.key + ' (' + words.length + ' სიტყვა)';
    }

    if (words.length < 50) {
        var defaults = rhymeDB['default'].split(',');
        while (words.length < 50) {
            words.push(defaults[words.length % defaults.length]);
        }
    }

    currentWords = words.slice(0, 50);

    for (var i = 0; i < 50; i++) {
        var englishWord = words[i];

        var li1 = document.createElement('li');
        var georgianPhonetic = englishToGeorgianPhonetic(englishWord);
        li1.innerHTML = '<span class="speaker-icon">🔊</span>' + englishWord + '<span class="georgian-phonetic">' + georgianPhonetic + '</span>';
        li1.style.fontSize = fontSize + 'em';
        li1.title = 'დააჭირეთ მოსასმენად';
        var phoneticSpan = li1.querySelector('.georgian-phonetic');
        if (phoneticSpan) {
            phoneticSpan.style.fontSize = (fontSize * 0.8) + 'em';
        }
        li1.onclick = (function(word) {
            return function() { speakWord(word, this); };
        })(englishWord);
        v1List.appendChild(li1);

        var li2 = document.createElement('li');
        li2.innerHTML = '<span class="speaker-icon">🔊</span>' + englishWord;
        li2.style.fontSize = fontSize + 'em';
        li2.title = 'დააჭირეთ მოსასმენად';
        li2.onclick = (function(word) {
            return function() { speakWord(word, this); };
        })(englishWord);
        v2List.appendChild(li2);
    }

    speakAllBtn.disabled = false;

    if (!variantStates.variant1) toggleVariant('variant1');
    if (!variantStates.variant2) toggleVariant('variant2');
}
</script>
